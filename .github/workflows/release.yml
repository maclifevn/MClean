name: Release

# Manual-only until Developer ID + notarization secrets are configured —
# a tag-push trigger would fail at the signing step and mark releases red.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.5). Must match project.yml MARKETING_VERSION.'
        required: true
        type: string
      dry_run:
        description: 'Build + sign + notarize but skip release upload + homebrew bump.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mclean-release
  cancel-in-progress: false

env:
  APP_NAME: MClean
  BUNDLE_ID: com.maclife.mclean
  SCHEME: MClean
  PROJECT: MClean.xcodeproj
  CONFIGURATION: Release

jobs:
  release:
    name: Build, sign, notarize, release
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${REQUESTED_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid app version'; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Verify version matches project.yml
        run: |
          PROJ_VERSION=$(grep -E '^\s*MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "${PROJ_VERSION}" != "${{ steps.ver.outputs.version }}" ]]; then
            echo "::error::project.yml MARKETING_VERSION (${PROJ_VERSION}) != release version (${{ steps.ver.outputs.version }}). Bump project.yml first."
            exit 1
          fi

      - name: Require an unused release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == maclifevn/MClean ]] || { echo '::error::Update URLs target maclifevn/MClean; configure the fork before releasing.'; exit 1; }
          if [[ "${DRY_RUN}" != true && "${GITHUB_REF}" != refs/heads/main ]]; then
            echo '::error::Publish releases from main after review. Use dry_run=true to validate a preparation branch.'
            exit 1
          fi
          STATUS=$(curl --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --output "${RUNNER_TEMP}/release-target.json" --write-out '%{http_code}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          case "${STATUS}" in
            404) ;;
            200) echo '::error::Release version already exists. Increase version and build; published archives are immutable.'; exit 1 ;;
            *) echo "::error::Could not verify release version (HTTP ${STATUS})."; exit 1 ;;
          esac

      - name: Require signing and notarization credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_APP_PASSWORD: ${{ secrets.NOTARIZATION_APP_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          MISSING=0
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD \
            NOTARIZATION_APPLE_ID NOTARIZATION_APP_PASSWORD SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: ${name}"
              MISSING=1
            fi
          done
          [[ "${MISSING}" == 0 ]]

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: |
          brew install xcodegen create-dmg xcbeautify

      - name: Install pinned Sparkle tools
        run: scripts/sparkle-tools.sh build/sparkle-tools

      - name: Prepare Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${SPARKLE_PRIVATE_KEY}" ]] || { echo '::error::SPARKLE_PRIVATE_KEY is required to sign updates.'; exit 1; }
          umask 077
          printf '%s' "${SPARKLE_PRIVATE_KEY}" > "${RUNNER_TEMP}/sparkle-private-key.txt"
          echo "SPARKLE_PRIVATE_KEY_FILE=${RUNNER_TEMP}/sparkle-private-key.txt" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-tests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Import Developer ID signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          CERT_PATH="${RUNNER_TEMP}/certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          echo -n "${BUILD_CERTIFICATE_BASE64}" | base64 --decode -o "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}" >/dev/null
          security list-keychain -d user -s "${KEYCHAIN_PATH}" $(security list-keychain -d user | xargs)
          SIGN_ID=$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | sed -nE 's/.*"(Developer ID Application:[^"]+)".*/\1/p' | head -n 1)
          if [[ -z "${SIGN_ID}" ]]; then
            echo "::error::No Developer ID Application identity found in imported certificate."
            exit 1
          fi
          SIGN_TEAM_ID=$(printf '%s\n' "${SIGN_ID}" | sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p')
          if [[ -z "${SIGN_TEAM_ID}" ]]; then
            echo "::error::Could not derive the signing team ID from: ${SIGN_ID}"
            exit 1
          fi
          PROJECT_TEAM=$(ruby -ryaml -e 'print YAML.load_file("project.yml").fetch("settings").fetch("base").fetch("DEVELOPMENT_TEAM")')
          [[ "${SIGN_TEAM_ID}" == "${PROJECT_TEAM}" ]] || { echo '::error::Signing certificate team differs from project.yml. Keep the released app identity stable.'; exit 1; }
          echo "SIGN_ID=${SIGN_ID}" >> "$GITHUB_ENV"
          echo "SIGN_TEAM_ID=${SIGN_TEAM_ID}" >> "$GITHUB_ENV"
          echo "Using signing identity: ${SIGN_ID}"

      - name: Validate and store notarization credentials
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_APP_PASSWORD: ${{ secrets.NOTARIZATION_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials MCLEAN_NOTARY \
            --apple-id "${NOTARIZATION_APPLE_ID}" \
            --password "${NOTARIZATION_APP_PASSWORD}" \
            --team-id "${SIGN_TEAM_ID}" \
            --keychain "${RUNNER_TEMP}/app-signing.keychain-db" \
            --validate

      - name: Archive (universal arm64 + x86_64)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -destination 'generic/platform=macOS' \
            -archivePath build/MClean.xcarchive \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGN_ID}" \
            DEVELOPMENT_TEAM="${SIGN_TEAM_ID}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            archive | xcbeautify

      - name: Export signed app
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${SIGN_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MClean.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist | xcbeautify

      - name: Verify codesign + hardened runtime
        run: |
          set -euo pipefail
          APP="build/export/MClean.app"
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign -dvv "${APP}" 2>&1 | tee /tmp/cs-info.txt
          grep -q "flags=0x10000(runtime)" /tmp/cs-info.txt || { echo "::error::Hardened runtime missing"; exit 1; }
          spctl --assess --type execute --verbose=4 "${APP}" || true
          # Universal arch check
          lipo -archs "${APP}/Contents/MacOS/MClean" | grep -q "x86_64" && lipo -archs "${APP}/Contents/MacOS/MClean" | grep -q "arm64"

      - name: Build notarized zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="build/MClean-${VERSION}.zip"
          # Notarize the .app inside a zip too (homebrew cask uses zip)
          ditto -c -k --keepParent --sequesterRsrc build/export/MClean.app build/MClean-app.zip
          xcrun notarytool submit build/MClean-app.zip \
            --keychain-profile MCLEAN_NOTARY \
            --keychain "${RUNNER_TEMP}/app-signing.keychain-db" \
            --wait --timeout 30m
          xcrun stapler staple build/export/MClean.app
          xcrun stapler validate build/export/MClean.app
          codesign --verify --deep --strict build/export/MClean.app
          spctl --assess --type execute --verbose=4 build/export/MClean.app
          # Final shippable zip with stapled ticket
          ditto -c -k --keepParent --sequesterRsrc build/export/MClean.app "${ZIP}"

      - name: Build DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DMG="build/MClean-${VERSION}.dmg"
          create-dmg \
            --volname "MClean ${VERSION}" \
            --window-size 540 360 \
            --icon-size 100 \
            --icon "MClean.app" 140 180 \
            --hide-extension "MClean.app" \
            --app-drop-link 400 180 \
            --no-internet-enable \
            "${DMG}" \
            build/export/MClean.app
          codesign --sign "${SIGN_ID}" --timestamp "${DMG}"
          codesign --verify --verbose=2 "${DMG}"

      - name: Notarize DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DMG="build/MClean-${VERSION}.dmg"
          xcrun notarytool submit "${DMG}" \
            --keychain-profile MCLEAN_NOTARY \
            --keychain "${RUNNER_TEMP}/app-signing.keychain-db" \
            --wait \
            --timeout 30m
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"
          spctl --assess --type install --verbose=4 "${DMG}"

      - name: Generate and verify signed appcast
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/previous-feed
          HTTP_STATUS=$(curl --location --silent --show-error --retry 3 \
            --header 'Cache-Control: no-cache' \
            --output build/previous-feed/appcast.xml --write-out '%{http_code}' \
            https://github.com/maclifevn/MClean/releases/download/appcast/appcast.xml)
          if [[ "${HTTP_STATUS}" == 200 ]]; then
            scripts/generate-sparkle-appcast.sh "build/MClean-${VERSION}.zip" build/appcast build/previous-feed/appcast.xml
          elif [[ "${HTTP_STATUS}" == 404 ]]; then
            scripts/generate-sparkle-appcast.sh "build/MClean-${VERSION}.zip" build/appcast
          else
            echo "::error::Could not retrieve previous appcast (HTTP ${HTTP_STATUS}); refusing to replace update history."
            exit 1
          fi

      - name: Compute SHA256 checksums
        id: sha
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DMG_SHA=$(shasum -a 256 "build/MClean-${VERSION}.dmg" | awk '{print $1}')
          ZIP_SHA=$(shasum -a 256 "build/MClean-${VERSION}.zip" | awk '{print $1}')
          echo "dmg=${DMG_SHA}" >> "$GITHUB_OUTPUT"
          echo "zip=${ZIP_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Checksums"
            echo ""
            echo "| Asset | SHA-256 |"
            echo "|-------|---------|"
            echo "| MClean-${VERSION}.dmg | \`${DMG_SHA}\` |"
            echo "| MClean-${VERSION}.zip | \`${ZIP_SHA}\` |"
          } > build/CHECKSUMS.md

      - name: Upload artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: mclean-${{ steps.ver.outputs.version }}
          path: |
            build/MClean-${{ steps.ver.outputs.version }}.dmg
            build/MClean-${{ steps.ver.outputs.version }}.zip
            build/CHECKSUMS.md
            build/appcast/appcast.xml
            build/MClean.xcarchive/dSYMs
          retention-days: 14

      - name: Create immutable GitHub release
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE=build/release-notes.md
          {
            echo "## MClean ${VERSION}"
            echo ""
            echo "Universal binary (Intel + Apple Silicon). Signed with Developer ID + notarized + stapled by Apple."
            echo ""
            cat build/CHECKSUMS.md
            echo ""
            echo "### Install"
            echo ""
            echo "\`\`\`"
            echo "brew tap maclifevn/tap"
            echo "brew install --cask mclean"
            echo "\`\`\`"
            if [[ "${VERSION}" == 1.0.5 ]]; then
              echo ""
              echo "### Upgrading from 1.0.4"
              echo ""
              echo "Version 1.0.5 adds Sparkle for future updates. Install this version once to enable in-app updates."
              echo "The signing certificate changes from Apple Development to Developer ID. You may need to grant Full Disk Access again to the new MClean in Applications, then relaunch the app."
              echo ""
              echo "Bản 1.0.5 bổ sung Sparkle: cài bản này một lần để nhận cập nhật trong app. Chữ ký chuyển sang Developer ID; nếu quyền cũ không còn hiệu lực, hãy cấp lại Full Disk Access cho MClean mới trong Applications và khởi động lại app."
            fi
          } > "${NOTES_FILE}"

          gh release create "${TAG}" \
            "build/MClean-${VERSION}.dmg" \
            "build/MClean-${VERSION}.zip" \
            "build/appcast/appcast.xml" \
            --title "MClean ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publish update feed after release assets are available
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view appcast --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload appcast build/appcast/appcast.xml --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create appcast build/appcast/appcast.xml \
              --title 'MClean update feed' --prerelease --latest=false \
              --target "${GITHUB_SHA}" \
              --notes 'Signed Sparkle appcast. Download MClean from the versioned app releases.' \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Bump in-repo homebrew formula
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP_SHA: ${{ steps.sha.outputs.zip }}
        run: |
          set -euo pipefail
          FORMULA=homebrew/mclean.rb
          /usr/bin/sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" "${FORMULA}"
          /usr/bin/sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${ZIP_SHA}\"/" "${FORMULA}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FORMULA}"
          if git diff --cached --quiet; then
            echo "No formula changes to commit."
          else
            git commit -m "homebrew: bump to ${VERSION} (sha256 ${ZIP_SHA:0:12})"
            git push origin HEAD:main
          fi

      - name: Bump tap formula (maclifevn/homebrew-tap)
        # `env.HOMEBREW_TAP_TOKEN != ''` evaluated empty because env was
        # step-scoped — referencing the secret directly works in step `if`
        # per GitHub Actions docs. Also emits a loud warning when the secret
        # is absent so future runs don't silently skip again.
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP_SHA: ${{ steps.sha.outputs.zip }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::warning title=Tap bump skipped::HOMEBREW_TAP_TOKEN secret is not set. Tap will stay at its previous version. Set the secret to enable auto-bumps."
            exit 0
          fi
          TAP_DIR="${RUNNER_TEMP}/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/maclifevn/homebrew-tap.git" "${TAP_DIR}"
          cd "${TAP_DIR}"
          # Cask path may be Casks/mclean.rb or mclean.rb depending on tap layout
          FORMULA=$(find . -name 'mclean.rb' -not -path './.git/*' | head -1)
          if [[ -z "${FORMULA}" ]]; then
            echo "::error::mclean.rb not found in tap"
            exit 1
          fi
          /usr/bin/sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" "${FORMULA}"
          /usr/bin/sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${ZIP_SHA}\"/" "${FORMULA}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FORMULA}"
          if git diff --cached --quiet; then
            echo "No tap formula changes."
          else
            git commit -m "mclean: bump to ${VERSION} (sha256 ${ZIP_SHA:0:12})"
            git push origin HEAD
          fi

      - name: Cleanup signing and notarization keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/sparkle-private-key.txt" || true
          rm -f "${RUNNER_TEMP}/certificate.p12" || true
          rm -rf "${RUNNER_TEMP}/homebrew-tap" || true
